<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>تطبيق السواق — Maestro</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<style>
:root{
  --ink:#141311; --ink2:#242219; --paper:#FBF9F4; --panel:#F2EEE3;
  --gold:#F2B705; --gold-deep:#8a5c00; --bolt:#E8542A;
  --line:#E4DFCF; --line-strong:#d7d0ba; --muted:#8c8672;
  --danger:#c1443c; --ok:#3f7a52;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Tajawal',sans-serif; background:var(--paper); color:var(--ink); min-height:100vh;}
.mono{font-family:'JetBrains Mono',monospace;}
.topbar{background:var(--ink); color:#fff; padding:16px 20px; display:flex; align-items:center; justify-content:space-between; border-bottom:2px solid var(--gold); position:sticky; top:0; z-index:10;}
.topbar b{font-size:17px; font-weight:900;}
.topbar span{font-size:10px; color:var(--gold); letter-spacing:2px; font-family:'JetBrains Mono',monospace; display:block; margin-top:2px;}
.status{font-size:11px; padding:6px 12px; border-radius:20px; background:#1b1a15; color:#8a8574; font-weight:700; display:flex; align-items:center; gap:6px;}
.status.live{color:var(--ok);}
.status .dot{width:7px; height:7px; border-radius:50%; background:currentColor;}

.wrap{max-width:520px; margin:0 auto; padding:16px 16px 40px;}
.stats{display:flex; gap:10px; margin-bottom:18px;}
.stat{flex:1; background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; text-align:center;}
.stat b{display:block; font-size:20px; font-weight:900; color:var(--gold-deep);}
.stat span{font-size:10.5px; color:var(--muted);}

.sec-title{font-size:14px; font-weight:900; margin:6px 0 12px; display:flex; align-items:center; gap:6px;}
.sec-title i{color:var(--gold-deep);}

.order-card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; position:relative;}
.order-card.ready{border-color:var(--gold-deep); box-shadow:0 0 0 2px rgba(138,92,0,.1);}
.o-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; padding-bottom:10px; border-bottom:2px dashed var(--line-strong);}
.o-head b{font-size:14px; font-weight:900;}
.o-head span{font-size:10.5px; color:var(--muted); font-family:'JetBrains Mono',monospace;}
.o-row{display:flex; align-items:flex-start; gap:8px; font-size:12.5px; margin-bottom:7px; color:var(--ink2);}
.o-row i{color:var(--gold-deep); margin-top:2px;}
.o-total{display:flex; justify-content:space-between; font-weight:900; font-size:14px; margin-top:8px; padding-top:8px; border-top:1px solid var(--line);}
.pay-tag{display:inline-block; font-size:10px; font-weight:700; padding:3px 9px; border-radius:20px; background:var(--panel); color:var(--ink2); margin-top:4px;}
.pay-tag.cash{background:#e8f1ec; color:var(--ok);}
.o-actions{margin-top:12px;}
.o-actions button{width:100%; padding:12px; border-radius:10px; border:none; font-family:inherit; font-weight:900; font-size:13px; display:flex; align-items:center; justify-content:center; gap:8px;}
.btn-claim{background:var(--gold); color:var(--ink);}
.btn-deliver{background:var(--ok); color:#fff;}
.empty{text-align:center; padding:40px 20px; color:var(--muted);}
.empty i{font-size:36px; display:block; margin-bottom:10px; color:var(--line-strong);}

/* ---------- driver setup overlay ---------- */
.overlay{position:fixed; inset:0; background:rgba(10,9,7,.7); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
.setup-card{background:#fff; border-radius:16px; padding:24px; max-width:360px; width:100%;}
.setup-card h3{font-size:16px; font-weight:900; margin-bottom:6px;}
.setup-card p{font-size:12px; color:var(--muted); margin-bottom:16px; line-height:1.6;}
.setup-card label{font-size:11px; color:var(--muted); display:block; margin:10px 0 5px; font-weight:500;}
.setup-card input{width:100%; border:1px solid var(--line-strong); border-radius:9px; padding:11px; font-family:inherit; font-size:13px;}
.setup-card button{width:100%; margin-top:16px; background:var(--ink); color:var(--gold); border:none; border-radius:10px; padding:13px; font-family:inherit; font-weight:900; font-size:13.5px;}
.driver-pill{position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--gold); font-size:11px; font-weight:700; padding:8px 16px; border-radius:20px; display:flex; align-items:center; gap:8px; z-index:20;}
.driver-pill button{background:none; border:none; color:#a39d89; font-size:11px; text-decoration:underline; font-family:inherit;}
</style>
</head>
<body>

<div class="topbar">
  <div><b>تطبيق السواق</b><span>MAESTRO CAPTAIN</span></div>
  <div class="status" id="connStatus"><div class="dot"></div><span>بيتصل...</span></div>
</div>

<div class="wrap">
  <div class="stats">
    <div class="stat"><b id="statReady">0</b><span>جاهزة للاستلام</span></div>
    <div class="stat"><b id="statMine">0</b><span>معايا دلوقتي</span></div>
    <div class="stat"><b id="statDone">0</b><span>سلمتها النهاردة</span></div>
  </div>

  <div class="sec-title"><i class="ti ti-package"></i> طلبات جاهزة للاستلام من المطعم</div>
  <div id="readyList"></div>

  <div class="sec-title" style="margin-top:22px;"><i class="ti ti-motorbike"></i> طلباتي الحالية</div>
  <div id="mineList"></div>
</div>

<div class="driver-pill" id="driverPill" style="display:none;">
  <i class="ti ti-user-circle"></i> <span id="driverPillName"></span>
  <button onclick="resetDriver()">تغيير</button>
</div>

<div class="overlay" id="setupOverlay">
  <div class="setup-card">
    <h3>بيانات السواق</h3>
    <p>اكتب اسمك ورقم موبايلك — العميل هيشوفهم في تطبيقه لما تستلم طلبه.</p>
    <label>الاسم</label>
    <input id="setupName" placeholder="مثال: محمد">
    <label>رقم الموبايل</label>
    <input id="setupPhone" type="tel" placeholder="01xxxxxxxxx">
    <button onclick="saveDriver()">ابدأ الشغل</button>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC2gMvHUG9j7hacZPvatn_3sThusofnW34",
  authDomain: "maestro-afandina.firebaseapp.com",
  databaseURL: "https://maestro-afandina-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "maestro-afandina",
  storageBucket: "maestro-afandina.firebasestorage.app",
  messagingSenderId: "682889796766",
  appId: "1:682889796766:web:23be439b383f5a29bd2f8f"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const PAY_LABELS = {cash:'كاش عند الاستلام', vodafone:'فودافون كاش', instapay:'إنستاباي'};
let orders = {};
let driver = null;

function loadDriver(){
  const raw = localStorage.getItem('maestro_driver');
  if(raw){ driver = JSON.parse(raw); }
}
function saveDriver(){
  const name = document.getElementById('setupName').value.trim();
  const phone = document.getElementById('setupPhone').value.trim();
  if(!name || !phone){ alert('اكتب الاسم والرقم'); return; }
  driver = {name, phone};
  localStorage.setItem('maestro_driver', JSON.stringify(driver));
  showApp();
}
function resetDriver(){
  if(!confirm('تغيير بيانات السواق؟')) return;
  localStorage.removeItem('maestro_driver');
  driver = null;
  document.getElementById('setupOverlay').style.display='flex';
  document.getElementById('driverPill').style.display='none';
}
function showApp(){
  document.getElementById('setupOverlay').style.display='none';
  document.getElementById('driverPill').style.display='flex';
  document.getElementById('driverPillName').textContent = driver.name+' · '+driver.phone;
}

loadDriver();
if(driver) showApp();

db.ref('orders').on('value', snap=>{
  orders = snap.val() || {};
  document.getElementById('connStatus').className='status live';
  document.getElementById('connStatus').innerHTML='<div class="dot"></div><span>متصل لحظيًا</span>';
  render();
});

function render(){
  const entries = Object.entries(orders);
  const ready = entries.filter(([,o])=>o.status==='ready');
  const mine = entries.filter(([,o])=>o.status==='on_the_way' && driver && o.driverPhone===driver.phone);
  const todayStart = new Date(); todayStart.setHours(0,0,0,0);
  const doneToday = entries.filter(([,o])=>o.status==='delivered' && driver && o.driverPhone===driver.phone && o.createdAt>=todayStart.getTime());

  document.getElementById('statReady').textContent = ready.length;
  document.getElementById('statMine').textContent = mine.length;
  document.getElementById('statDone').textContent = doneToday.length;

  const readyList = document.getElementById('readyList');
  readyList.innerHTML = ready.length===0
    ? `<div class="empty"><i class="ti ti-package-off"></i><p>مفيش طلبات جاهزة دلوقتي</p></div>`
    : ready.map(([id,o])=>orderCard(id,o,'claim')).join('');

  const mineList = document.getElementById('mineList');
  mineList.innerHTML = mine.length===0
    ? `<div class="empty"><i class="ti ti-motorbike"></i><p>مفيش طلبات معاك دلوقتي</p></div>`
    : mine.map(([id,o])=>orderCard(id,o,'deliver')).join('');
}

function orderCard(id, o, mode){
  const itemsTxt = (o.items||[]).map(it=>`${it.name} ×${it.qty}`).join('، ');
  const action = mode==='claim'
    ? `<button class="btn-claim" onclick="claimOrder('${id}')"><i class="ti ti-check"></i> استلام الطلب من المطعم</button>`
    : `<button class="btn-deliver" onclick="deliverOrder('${id}')"><i class="ti ti-flag-check"></i> تم التسليم للعميل</button>`;
  return `<div class="order-card ${mode==='claim'?'ready':''}">
    <div class="o-head"><b>#${id.slice(-6).toUpperCase()}</b><span>${new Date(o.createdAt).toLocaleTimeString('ar-EG')}</span></div>
    <div class="o-row"><i class="ti ti-tools-kitchen-2"></i> ${itemsTxt}</div>
    <div class="o-row"><i class="ti ti-map-pin"></i> ${o.address||'—'}</div>
    <div class="o-row"><i class="ti ti-phone"></i> ${o.phone||'—'}</div>
    <span class="pay-tag ${o.payMethod==='cash'?'cash':''}">${o.payMethod==='cash'?'هتاخد كاش من العميل':'مدفوع أونلاين'} — ${PAY_LABELS[o.payMethod]||o.payMethod}</span>
    <div class="o-total"><span>إجمالي الطلب</span><span class="mono">${o.total} ج.م</span></div>
    <div class="o-actions">${action}</div>
  </div>`;
}

function claimOrder(id){
  if(!driver) return;
  db.ref('orders/'+id).update({
    status: 'on_the_way',
    driverName: driver.name,
    driverPhone: driver.phone,
    claimedAt: Date.now()
  });
}
function deliverOrder(id){
  db.ref('orders/'+id+'/status').set('delivered');
}
</script>
</body>
</html>
